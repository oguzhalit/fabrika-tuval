name: 🔄 Pull Request Workflow

on:
  pull_request:
    types: [opened, synchronize, closed]
  pull_request_review:
    types: [submitted]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: goal-hedef-preview
  CONTAINER_PORT: 80
  GUEST_VMID: "101"

jobs:
  # ========== CI STAGE ==========
  lint:
    name: 📝 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint with biome
        run: pnpm lint

  test:
    name: 🧪 Type Check
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck

  build:
    name: 🏗️ Build packages
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  ci-required:
    name: ✅ CI Status Check
    runs-on: ubuntu-latest
    if: always()
    needs: [build]
    steps:
      - name: Check CI passed
        run: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

  # ========== PREVIEW DEPLOY STAGE ==========
  deploy-preview:
    name: 🚀 Deploy Preview
    needs: [ci-required]
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: write
    env:
      PR_NUMBER: ${{ github.event.number }}
      IMAGE_TAG: pr-${{ github.event.number }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🐳 Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -f apps/goal-hedef/Dockerfile \
            .

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: 🚀 Deploy to Homelab
        env:
          PROXMOX_HOST: ${{ secrets.PROXMOX_HOST }}
          PROXMOX_PORT: ${{ secrets.PROXMOX_PORT }}
          PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
          PROXMOX_TOKEN_NAME: ${{ secrets.PROXMOX_TOKEN_NAME }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          set -e
          PROXMOX_API="https://${PROXMOX_HOST}:${PROXMOX_PORT}/api2/json"
          API_TOKEN="PVEAPIToken=${PROXMOX_USER}@pve!${PROXMOX_TOKEN_NAME}=${PROXMOX_TOKEN_SECRET}"

          echo "📍 Connecting to Proxmox..."
          NODE_RESPONSE=$(curl -s -k -w "\n%{http_code}" -H "Authorization: $API_TOKEN" "${PROXMOX_API}/cluster/resources?type=vm")
          HTTP_CODE=$(echo "$NODE_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$NODE_RESPONSE" | head -n-1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Proxmox API error (HTTP $HTTP_CODE)"
            exit 1
          fi

          NODE=$(echo "$RESPONSE_BODY" | jq -r ".data[] | select(.vmid | tonumber == ${{ env.GUEST_VMID }}) | .node" | head -1)
          [ -z "$NODE" ] && echo "❌ VM not found" && exit 1

          echo "✅ Found VM on node: $NODE"

          # Helper function to execute command via guest agent and wait for result
          exec_guest_cmd() {
            local desc=$1
            local cmd=$2
            echo "⏳ $desc..."

            # Start command (capture HTTP status)
            EXEC=$(curl -s -k -w "\n%{http_code}" -X POST -H "Authorization: $API_TOKEN" -H "Content-Type: application/json" \
              "${PROXMOX_API}/nodes/${NODE}/qemu/${{ env.GUEST_VMID }}/agent/exec" \
              -d "{\"command\": \"$cmd\"}")

            HTTP_CODE=$(echo "$EXEC" | tail -n1)
            EXEC_BODY=$(echo "$EXEC" | head -n-1)

            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ API Error (HTTP $HTTP_CODE): $EXEC_BODY"
              return 1
            fi

            PID=$(echo "$EXEC_BODY" | jq -r '.data.pid // empty')
            if [ -z "$PID" ]; then
              echo "❌ Failed to start command: $EXEC_BODY"
              return 1
            fi

            # Wait for completion (max 30s)
            for i in {1..30}; do
              sleep 1
              STATUS=$(curl -s -k -w "\n%{http_code}" -H "Authorization: $API_TOKEN" \
                "${PROXMOX_API}/nodes/${NODE}/qemu/${{ env.GUEST_VMID }}/agent/exec-status?pid=${PID}")

              STATUS_CODE=$(echo "$STATUS" | tail -n1)
              STATUS_BODY=$(echo "$STATUS" | head -n-1)

              if [ "$STATUS_CODE" != "200" ]; then
                echo "⚠️ Status API error (HTTP $STATUS_CODE), retrying..."
                continue
              fi

              EXITED=$(echo "$STATUS_BODY" | jq -r '.data.exited // empty')
              if [ "$EXITED" = "true" ]; then
                OUT=$(echo "$STATUS_BODY" | jq -r '.data."out-data" // ""' | base64 -d 2>/dev/null || echo "")
                ERR=$(echo "$STATUS_BODY" | jq -r '.data."err-data" // ""' | base64 -d 2>/dev/null || echo "")
                EXIT_CODE=$(echo "$STATUS_BODY" | jq -r '.data."exit-code" // 0')

                if [ -n "$OUT" ]; then echo "Output: $OUT"; fi
                if [ -n "$ERR" ]; then echo "Error: $ERR"; fi
                echo "✅ Exit code: $EXIT_CODE"
                return $EXIT_CODE
              fi
            done

            echo "⚠️ Timeout waiting for command"
            return 1
          }

          # Step 1: Docker login
          exec_guest_cmd "🔐 Docker login" "sh -c 'echo \${{ secrets.GITHUB_TOKEN }} | docker login -u ${{ github.actor }} --password-stdin ${{ env.REGISTRY }}'"

          # Step 2: Pull image
          exec_guest_cmd "📥 Pull image" "sh -c 'docker pull ${{ env.REGISTRY_IMAGE }}'"

          # Step 3: Stop existing
          exec_guest_cmd "🛑 Stop existing container" "sh -c 'docker stop pr-${{ env.PR_NUMBER }}-draw 2>/dev/null || true'"

          # Step 4: Remove existing
          exec_guest_cmd "🗑️ Remove existing container" "sh -c 'docker rm pr-${{ env.PR_NUMBER }}-draw 2>/dev/null || true'"

          # Step 5: Run new container
          exec_guest_cmd "🐳 Run new container" "sh -c 'docker run -d --name pr-${{ env.PR_NUMBER }}-draw -p 3000:${{ env.CONTAINER_PORT }} ${{ env.REGISTRY_IMAGE }}'"

          # Step 6: Verify
          exec_guest_cmd "✅ Verify container" "sh -c 'docker ps -a --filter name=pr-${{ env.PR_NUMBER }}-draw'"

          echo "✅ Container deployed"

      - name: 🌐 Setup Cloudflare DNS
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_DOMAIN: ${{ secrets.CLOUDFLARE_DOMAIN }}
          HOMELAB_HOST: ${{ secrets.HOMELAB_HOST }}
        run: |
          set -e
          SUBDOMAIN="pr-${{ env.PR_NUMBER }}-draw"

          curl -s -X POST -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records \
            -d "{\"type\": \"CNAME\", \"name\": \"$SUBDOMAIN\", \"content\": \"$HOMELAB_HOST\", \"ttl\": 1, \"proxied\": true}" | jq '.'

          echo "✅ DNS record created"

      - name: 💬 Comment Preview URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ env.PR_NUMBER }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Preview Ready!**\n\n🌐 **URL:** [https://pr-${{ env.PR_NUMBER }}-draw.${{ secrets.CLOUDFLARE_DOMAIN }}](https://pr-${{ env.PR_NUMBER }}-draw.${{ secrets.CLOUDFLARE_DOMAIN }})`
            })

  # ========== PRODUCTION DEPLOY STAGE ==========
  deploy-production:
    name: 🌍 Deploy Production
    needs: [ci-required]
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🐳 Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest \
            -f apps/goal-hedef/Dockerfile \
            .

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest

      - name: 🚀 Deploy to Production
        env:
          PROXMOX_HOST: ${{ secrets.PROXMOX_HOST }}
          PROXMOX_PORT: ${{ secrets.PROXMOX_PORT }}
          PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
          PROXMOX_TOKEN_NAME: ${{ secrets.PROXMOX_TOKEN_NAME }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          set -e
          PROXMOX_API="https://${PROXMOX_HOST}:${PROXMOX_PORT}/api2/json"
          API_TOKEN="PVEAPIToken=${PROXMOX_USER}@pve!${PROXMOX_TOKEN_NAME}=${PROXMOX_TOKEN_SECRET}"

          echo "🌍 Finding production VM..."
          NODE=$(curl -s -k -H "Authorization: $API_TOKEN" "${PROXMOX_API}/cluster/resources?type=vm" | \
            jq -r ".data[] | select(.vmid | tonumber == ${{ env.GUEST_VMID }}) | .node" | head -1)
          [ -z "$NODE" ] && echo "❌ VM not found" && exit 1
          echo "✅ Found VM on node: $NODE"

          # Helper function to execute command via guest agent and wait for result
          exec_guest_cmd() {
            local desc=$1
            local cmd=$2
            echo "⏳ $desc..."

            # Start command (capture HTTP status)
            EXEC=$(curl -s -k -w "\n%{http_code}" -X POST -H "Authorization: $API_TOKEN" -H "Content-Type: application/json" \
              "${PROXMOX_API}/nodes/${NODE}/qemu/${{ env.GUEST_VMID }}/agent/exec" \
              -d "{\"command\": \"$cmd\"}")

            HTTP_CODE=$(echo "$EXEC" | tail -n1)
            EXEC_BODY=$(echo "$EXEC" | head -n-1)

            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ API Error (HTTP $HTTP_CODE): $EXEC_BODY"
              return 1
            fi

            PID=$(echo "$EXEC_BODY" | jq -r '.data.pid // empty')
            if [ -z "$PID" ]; then
              echo "❌ Failed to start command: $EXEC_BODY"
              return 1
            fi

            # Wait for completion (max 60s for production)
            for i in {1..60}; do
              sleep 1
              STATUS=$(curl -s -k -H "Authorization: $API_TOKEN" \
                "${PROXMOX_API}/nodes/${NODE}/qemu/${{ env.GUEST_VMID }}/agent/exec-status?pid=${PID}")

              EXITED=$(echo "$STATUS" | jq -r '.data.exited // empty')
              if [ "$EXITED" = "true" ]; then
                OUT=$(echo "$STATUS" | jq -r '.data."out-data" // ""' | base64 -d 2>/dev/null || echo "")
                ERR=$(echo "$STATUS" | jq -r '.data."err-data" // ""' | base64 -d 2>/dev/null || echo "")
                EXIT_CODE=$(echo "$STATUS" | jq -r '.data."exit-code" // 0')

                if [ -n "$OUT" ]; then echo "Output: $OUT"; fi
                if [ -n "$ERR" ]; then echo "Error: $ERR"; fi
                echo "✅ Exit code: $EXIT_CODE"
                return $EXIT_CODE
              fi
            done

            echo "⚠️ Timeout waiting for command"
            return 1
          }

          # Step 1: Docker login
          exec_guest_cmd "🔐 Docker login" "sh -c 'echo ${GITHUB_TOKEN} | docker login -u ${GITHUB_ACTOR} --password-stdin ${REGISTRY}'"

          # Step 2: Pull image
          exec_guest_cmd "📥 Pull image" "sh -c 'docker pull ${REGISTRY_IMAGE}'"

          # Step 3: Stop existing
          exec_guest_cmd "🛑 Stop existing container" "sh -c 'docker stop draw 2>/dev/null || true'"

          # Step 4: Remove existing
          exec_guest_cmd "🗑️ Remove existing container" "sh -c 'docker rm draw 2>/dev/null || true'"

          # Step 5: Run new container
          exec_guest_cmd "🐳 Run new container" "sh -c 'docker run -d --name draw -p 80:${{ env.CONTAINER_PORT }} ${REGISTRY_IMAGE}'"

          # Step 6: Verify
          exec_guest_cmd "✅ Verify container" "sh -c 'docker ps -a --filter name=draw'"

          echo "✅ Production deployed"

      - name: 💬 Comment Production URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ env.PR_NUMBER }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🌍 **Production Live!**\n\n🎉 Your changes are now live at https://draw.oguzsak.com`
            })

  # ========== CLEANUP STAGE ==========
  cleanup:
    name: 🧹 Cleanup Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.number }}

    steps:
      - name: 🗑️ Stop Container
        env:
          PROXMOX_HOST: ${{ secrets.PROXMOX_HOST }}
          PROXMOX_PORT: ${{ secrets.PROXMOX_PORT }}
          PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
          PROXMOX_TOKEN_NAME: ${{ secrets.PROXMOX_TOKEN_NAME }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
        run: |
          set -e
          PROXMOX_API="https://${PROXMOX_HOST}:${PROXMOX_PORT}/api2/json"
          API_TOKEN="PVEAPIToken=${PROXMOX_USER}@pve!${PROXMOX_TOKEN_NAME}=${PROXMOX_TOKEN_SECRET}"

          NODE=$(curl -s -k -H "Authorization: $API_TOKEN" "${PROXMOX_API}/cluster/resources?type=vm" | \
            jq -r ".data[] | select(.vmid | tonumber == ${{ env.GUEST_VMID }}) | .node" | head -1)
          [ -z "$NODE" ] && echo "⚠️ VM not found, skipping cleanup" && exit 0

          # Helper function to execute command via guest agent
          exec_guest_cmd() {
            local desc=$1
            local cmd=$2
            echo "⏳ $desc..."

            # Start command (capture HTTP status)
            EXEC=$(curl -s -k -w "\n%{http_code}" -X POST -H "Authorization: $API_TOKEN" -H "Content-Type: application/json" \
              "${PROXMOX_API}/nodes/${NODE}/qemu/${{ env.GUEST_VMID }}/agent/exec" \
              -d "{\"command\": \"$cmd\"}" 2>/dev/null)

            HTTP_CODE=$(echo "$EXEC" | tail -n1)
            EXEC_BODY=$(echo "$EXEC" | head -n-1)

            PID=$(echo "$EXEC_BODY" | jq -r '.data.pid // empty')
            if [ -z "$PID" ]; then
              echo "⚠️ Could not start cleanup (HTTP $HTTP_CODE), skipping"
              return 0
            fi

            # Wait for completion (max 15s)
            for i in {1..15}; do
              sleep 1
              STATUS=$(curl -s -k -w "\n%{http_code}" -H "Authorization: $API_TOKEN" \
                "${PROXMOX_API}/nodes/${NODE}/qemu/${{ env.GUEST_VMID }}/agent/exec-status?pid=${PID}" 2>/dev/null)

              STATUS_CODE=$(echo "$STATUS" | tail -n1)
              STATUS_BODY=$(echo "$STATUS" | head -n-1)

              if [ "$STATUS_CODE" != "200" ]; then
                continue
              fi

              EXITED=$(echo "$STATUS_BODY" | jq -r '.data.exited // empty')
              if [ "$EXITED" = "true" ]; then
                echo "✅ Cleaned up"
                return 0
              fi
            done

            echo "⚠️ Cleanup timeout"
            return 0
          }

          exec_guest_cmd "Stop container" "sh -c 'docker stop pr-${{ env.PR_NUMBER }}-draw 2>/dev/null || true'"
          exec_guest_cmd "Remove container" "sh -c 'docker rm pr-${{ env.PR_NUMBER }}-draw 2>/dev/null || true'"

      - name: 🌐 Remove DNS Record
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_DOMAIN: ${{ secrets.CLOUDFLARE_DOMAIN }}
        run: |
          set -e
          RECORD=$(curl -s -X GET -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=pr-${{ env.PR_NUMBER }}-draw.$CF_DOMAIN")

          RECORD_ID=$(echo $RECORD | jq -r '.result[0].id // empty')
          [ ! -z "$RECORD_ID" ] && curl -s -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$RECORD_ID" || true

          echo "✅ DNS cleaned up"

      - name: 💬 Cleanup Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ env.PR_NUMBER }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🧹 **Preview Cleaned**\n\nDocker container and DNS record removed.`
            })

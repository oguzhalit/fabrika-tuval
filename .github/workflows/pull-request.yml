name: 🔄 Pull Request & Deploy Workflow

on:
  pull_request:
    types: [opened, synchronize, closed]
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: goal-hedef-preview
  CONTAINER_PORT: 80
  GUEST_VMID: "101"

jobs:
  # ========== CI STAGE ==========
  lint:
    name: 📝 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint with biome
        run: pnpm lint

  test:
    name: 🧪 Type Check
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck

  build:
    name: 🏗️ Build packages
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  ci-required:
    name: ✅ CI Status Check
    runs-on: ubuntu-latest
    if: always()
    needs: [build]
    steps:
      - name: Check CI passed
        run: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

  # ========== PREVIEW DEPLOY STAGE ==========
  deploy-preview:
    name: 🚀 Deploy Preview
    needs: [ci-required]
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: write
    env:
      PR_NUMBER: ${{ github.event.number }}
      IMAGE_TAG: pr-${{ github.event.number }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🐳 Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -f apps/goal-hedef/Dockerfile \
            .

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: 🚀 Deploy to Homelab
        env:
          PVE_TOKEN: PVEAPIToken=${{ secrets.PROXMOX_USER }}@pve!${{ secrets.PROXMOX_TOKEN_NAME }}=${{ secrets.PROXMOX_TOKEN_SECRET }}
          PVE_URL: https://${{ secrets.PROXMOX_HOST }}:${{ secrets.PROXMOX_PORT }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY: ${{ env.REGISTRY }}
          NODE: prox
          VMID: ${{ env.GUEST_VMID }}
        run: |
          set -e

          echo "📍 Connecting to Proxmox Guest Agent via $PVE_URL"

          # Helper function to execute command via guest agent
          exec_guest_cmd() {
            local desc=$1
            local cmd=$2
            echo ""
            echo "⏳ $desc"

            # 1. Start command and get PID
            # Extract actual command from "sh -c 'command'" pattern
            if [[ $cmd =~ ^sh\ -c\ \'(.*)\'$ ]]; then
              local actual_cmd="${BASH_REMATCH[1]}"
              RESP=$(curl -s -k -X POST "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/agent/exec" \
                -H "Authorization: $PVE_TOKEN" \
                --data-urlencode "command=sh" \
                --data-urlencode "command=-c" \
                --data-urlencode "command=$actual_cmd")
            else
              echo "❌ Command must be wrapped with sh -c 'command'"
              return 1
            fi

            echo "  [DEBUG] curl response: $RESP"
            PID=$(echo "$RESP" | jq -r '.data.pid // empty')
            if [ -z "$PID" ]; then
              echo "❌ Failed to start command"
              echo "Response: $RESP"
              return 1
            fi

            echo "  PID: $PID"

            # 2. Poll for completion (max 30s)
            for i in {1..30}; do
              sleep 1

              STATUS=$(curl -s -k -X GET "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/agent/exec-status?pid=$PID" \
                -H "Authorization: $PVE_TOKEN")

              EXITED=$(echo "$STATUS" | jq -r '.data.exited // 0')

              if [ "$EXITED" -eq 1 ]; then
                EXITCODE=$(echo "$STATUS" | jq -r '.data.exitcode // 0')
                OUT=$(echo "$STATUS" | jq -r '.data["out-data"] // ""')
                ERR=$(echo "$STATUS" | jq -r '.data["err-data"] // ""')

                if [ -n "$OUT" ]; then
                  echo "  Output: $OUT"
                fi
                if [ -n "$ERR" ]; then
                  echo "  Error: $ERR"
                fi

                if [ "$EXITCODE" -eq 0 ]; then
                  echo "  ✅ Success"
                  return 0
                else
                  echo "  ❌ Exit code: $EXITCODE"
                  return $EXITCODE
                fi
              fi
            done

            echo "  ⚠️ Timeout waiting for command"
            return 1
          }

          # Find available port and generate unique container name
          CONTAINER_SUFFIX=$(date +%s%N | tail -c 6)
          CONTAINER_NAME="pr-${{ env.PR_NUMBER }}-draw-$CONTAINER_SUFFIX"

          # Find first available port (3000-3999)
          PREVIEW_PORT=""
          for port in {3000..3999}; do
            # Test if port is available using /dev/tcp
            PORT_TEST=$(curl -s -k -X POST "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/agent/exec" \
              -H "Authorization: $PVE_TOKEN" \
              --data-urlencode "command=sh" \
              --data-urlencode "command=-c" \
              --data-urlencode "command=(timeout 1 bash -c '</dev/tcp/localhost/$port') 2>/dev/null && echo USED || echo FREE" 2>/dev/null)

            PID=$(echo "$PORT_TEST" | jq -r '.data.pid // empty')
            if [ -z "$PID" ]; then
              PREVIEW_PORT=$port
              break
            fi

            # Check result (max 3s wait)
            for i in {1..6}; do
              sleep 0.5
              STATUS=$(curl -s -k -X GET "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/agent/exec-status?pid=$PID" \
                -H "Authorization: $PVE_TOKEN")
              EXITED=$(echo "$STATUS" | jq -r '.data.exited // 0')
              if [ "$EXITED" -eq 1 ]; then
                RESULT=$(echo "$STATUS" | jq -r '.data["out-data"] // "UNKNOWN"' | tr -d ' \n')
                if [ "$RESULT" = "FREE" ]; then
                  PREVIEW_PORT=$port
                  break 2
                fi
                break
              fi
            done
          done

          # Fallback
          if [ -z "$PREVIEW_PORT" ]; then
            PREVIEW_PORT=$((3000 + ${{ env.PR_NUMBER }}))
          fi

          echo "📌 Container: $CONTAINER_NAME"
          echo "📌 Port: $PREVIEW_PORT"

          # Save deployment info for next steps
          echo "CONTAINER_NAME=$CONTAINER_NAME" >> $GITHUB_ENV
          echo "PREVIEW_PORT=$PREVIEW_PORT" >> $GITHUB_ENV

          # Step 1: Docker login
          exec_guest_cmd "🔐 Docker login" "sh -c 'echo $GITHUB_TOKEN | docker login -u $GITHUB_ACTOR --password-stdin $REGISTRY'"

          # Step 2: Pull image
          exec_guest_cmd "📥 Pull image" "sh -c 'docker pull $REGISTRY_IMAGE'"

          # Step 3: Run container with unique name on available port
          exec_guest_cmd "🐳 Run $CONTAINER_NAME:$PREVIEW_PORT" "sh -c 'docker run -d --name $CONTAINER_NAME -p $PREVIEW_PORT:${{ env.CONTAINER_PORT }} $REGISTRY_IMAGE'"

          # Step 4: Verify
          exec_guest_cmd "✅ Verify container" "sh -c 'docker ps -a --filter name=$CONTAINER_NAME'"

          echo ""
          echo "✅ Container deployed successfully"

      - name: 🌐 Setup Cloudflare Tunnel & DNS
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_DOMAIN: ${{ secrets.CLOUDFLARE_DOMAIN }}
          CF_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PVE_TOKEN: PVEAPIToken=${{ secrets.PROXMOX_USER }}@pve!${{ secrets.PROXMOX_TOKEN_NAME }}=${{ secrets.PROXMOX_TOKEN_SECRET }}
          PVE_URL: https://${{ secrets.PROXMOX_HOST }}:${{ secrets.PROXMOX_PORT }}
          NODE: prox
          VMID: ${{ env.GUEST_VMID }}
          PREVIEW_PORT: ${{ env.PREVIEW_PORT }}
        run: |
          set -e
          SUBDOMAIN="pr-${{ env.PR_NUMBER }}-draw"
          FULL_HOSTNAME="${SUBDOMAIN}.$CF_DOMAIN"
          TUNNEL_CNAME="${CF_TUNNEL_ID}.cfargotunnel.com"

          # 1. Fetch Homelab IP dynamically from Proxmox
          echo "📍 Fetching Homelab IP from Proxmox..."
          HOMELAB_IP=$(curl -s -k -X GET "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/agent/network-get-interfaces" \
            -H "Authorization: $PVE_TOKEN" | \
            jq -r '.data.result[] | select(.name == "ens18") | .["ip-addresses"][] | select(.["ip-address-type"] == "ipv4") | .["ip-address"]' | head -1)

          if [ -z "$HOMELAB_IP" ]; then
            HOMELAB_IP="10.10.10.107"
            echo "⚠️ Using fallback IP: $HOMELAB_IP"
          else
            echo "✅ Detected IP: $HOMELAB_IP"
          fi

          TARGET_SERVICE="http://${HOMELAB_IP}:${PREVIEW_PORT}"
          echo "📍 Target: $FULL_HOSTNAME -> $TARGET_SERVICE"

          # 2. DNS CNAME Record Check/Create (prevents 81053 error)
          echo "📝 DNS CNAME record management..."
          EXISTING_DNS_ID=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${FULL_HOSTNAME}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result[0].id // empty')

          if [ -z "$EXISTING_DNS_ID" ]; then
            echo "  Creating DNS CNAME record..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"type\": \"CNAME\",
                \"name\": \"${SUBDOMAIN}\",
                \"content\": \"${TUNNEL_CNAME}\",
                \"ttl\": 1,
                \"proxied\": true
              }" | jq .
            echo "  ✅ DNS CNAME created"
          else
            echo "  ✅ DNS record already exists (skipping)"
          fi

          # 3. Published Application Route (Tunnel Ingress) Ekleme
          echo "🔌 Updating Cloudflare Tunnel Configurations (Published Routes)..."
          # Mevcut tünel ingress listesini çek
          CURRENT_CONFIG=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/cfd_tunnel/$CF_TUNNEL_ID/configurations" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")
          # Yeni rotayı listeye ekle (404 kuralından hemen önceye)
          UPDATED_PAYLOAD=$(echo "$CURRENT_CONFIG" | jq \
            --arg host "$FULL_HOSTNAME" \
            --arg service "$TARGET_SERVICE" \
            '
            .result.config.ingress as $ing
            | ($ing | map(select(.hostname != $host and .service != "http_status:404"))) as $filtered
            | {
                config: {
                  ingress: ([{"hostname": $host, "service": $service}] + $filtered + [{"service": "http_status:404"}])
                }
              }
            ')
          # Cloudflare tüneline PUT et
          TUNNEL_RESPONSE=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/cfd_tunnel/$CF_TUNNEL_ID/configurations" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$UPDATED_PAYLOAD")
          echo "📋 Tunnel API Response:"
          echo "$TUNNEL_RESPONSE" | jq '.'
          SUCCESS=$(echo "$TUNNEL_RESPONSE" | jq -r '.success // false')
          if [ "$SUCCESS" = "true" ]; then
            echo "✅ Published Application Route created: $FULL_HOSTNAME → $TARGET_SERVICE"
          else
            echo "❌ Hata oluştu: $(echo "$TUNNEL_RESPONSE" | jq -r '.errors[0].message // "Unknown error"')"
          fi

      - name: 💬 Comment Preview URL
        env:
          CONTAINER_SUFFIX: ${{ env.CONTAINER_SUFFIX }}
          PREVIEW_PORT: ${{ env.PREVIEW_PORT }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ env.PR_NUMBER }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Preview Ready!**\n\n🌐 **URL:** [https://pr-${{ env.PR_NUMBER }}-draw.${{ secrets.CLOUDFLARE_DOMAIN }}](https://pr-${{ env.PR_NUMBER }}-draw.${{ secrets.CLOUDFLARE_DOMAIN }})\n\n📝 **Details:**\n- Container: \`pr-${{ env.PR_NUMBER }}-draw-${{ env.CONTAINER_SUFFIX }}\`\n- Port: \`${{ env.PREVIEW_PORT }}\``
            })

  # ========== PRODUCTION DEPLOY STAGE ==========
  deploy-production:
    name: 🌍 Deploy Production
    needs: [ci-required]
    if: (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🐳 Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest \
            -f apps/goal-hedef/Dockerfile \
            .

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest

      - name: 🚀 Deploy to Production
        env:
          PVE_TOKEN: PVEAPIToken=${{ secrets.PROXMOX_USER }}@pve!${{ secrets.PROXMOX_TOKEN_NAME }}=${{ secrets.PROXMOX_TOKEN_SECRET }}
          PVE_URL: https://${{ secrets.PROXMOX_HOST }}:${{ secrets.PROXMOX_PORT }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY: ${{ env.REGISTRY }}
          NODE: prox
          VMID: ${{ env.GUEST_VMID }}
        run: |
          set -e

          echo "🌍 Deploying to production..."

          # Helper function to execute command via guest agent
          exec_guest_cmd() {
            local desc=$1
            local cmd=$2
            echo ""
            echo "⏳ $desc"

            # 1. Start command and get PID
            # Extract actual command from "sh -c 'command'" pattern
            if [[ $cmd =~ ^sh\ -c\ \'(.*)\'$ ]]; then
              local actual_cmd="${BASH_REMATCH[1]}"
              RESP=$(curl -s -k -X POST "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/agent/exec" \
                -H "Authorization: $PVE_TOKEN" \
                --data-urlencode "command=sh" \
                --data-urlencode "command=-c" \
                --data-urlencode "command=$actual_cmd")
            else
              echo "❌ Command must be wrapped with sh -c 'command'"
              return 1
            fi

            echo "  [DEBUG] curl response: $RESP"
            PID=$(echo "$RESP" | jq -r '.data.pid // empty')
            if [ -z "$PID" ]; then
              echo "❌ Failed to start command"
              echo "Response: $RESP"
              return 1
            fi

            echo "  PID: $PID"

            # 2. Poll for completion (max 60s for production)
            for i in {1..60}; do
              sleep 1

              STATUS=$(curl -s -k -X GET "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/agent/exec-status?pid=$PID" \
                -H "Authorization: $PVE_TOKEN")

              EXITED=$(echo "$STATUS" | jq -r '.data.exited // 0')

              if [ "$EXITED" -eq 1 ]; then
                EXITCODE=$(echo "$STATUS" | jq -r '.data.exitcode // 0')
                OUT=$(echo "$STATUS" | jq -r '.data["out-data"] // ""')
                ERR=$(echo "$STATUS" | jq -r '.data["err-data"] // ""')

                if [ -n "$OUT" ]; then
                  echo "  Output: $OUT"
                fi
                if [ -n "$ERR" ]; then
                  echo "  Error: $ERR"
                fi

                if [ "$EXITCODE" -eq 0 ]; then
                  echo "  ✅ Success"
                  return 0
                else
                  echo "  ❌ Exit code: $EXITCODE"
                  return $EXITCODE
                fi
              fi
            done

            echo "  ⚠️ Timeout waiting for command"
            return 1
          }

          # Step 1: Docker login
          exec_guest_cmd "🔐 Docker login" "sh -c 'echo $GITHUB_TOKEN | docker login -u $GITHUB_ACTOR --password-stdin $REGISTRY'"

          # Step 2: Pull image
          exec_guest_cmd "📥 Pull image" "sh -c 'docker pull $REGISTRY_IMAGE'"

          # Find available port for production (5000-5999 range)
          PROD_PORT=""
          for port in {5000..5999}; do
            PORT_TEST=$(curl -s -k -X POST "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/agent/exec" \
              -H "Authorization: $PVE_TOKEN" \
              --data-urlencode "command=sh" \
              --data-urlencode "command=-c" \
              --data-urlencode "command=(timeout 1 bash -c '</dev/tcp/localhost/$port') 2>/dev/null && echo USED || echo FREE" 2>/dev/null)

            PID=$(echo "$PORT_TEST" | jq -r '.data.pid // empty')
            if [ -z "$PID" ]; then
              PROD_PORT=$port
              break
            fi

            for i in {1..6}; do
              sleep 0.5
              STATUS=$(curl -s -k -X GET "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/agent/exec-status?pid=$PID" \
                -H "Authorization: $PVE_TOKEN")
              EXITED=$(echo "$STATUS" | jq -r '.data.exited // 0')
              if [ "$EXITED" -eq 1 ]; then
                RESULT=$(echo "$STATUS" | jq -r '.data["out-data"] // "UNKNOWN"' | tr -d ' \n')
                if [ "$RESULT" = "FREE" ]; then
                  PROD_PORT=$port
                  break 2
                fi
                break
              fi
            done
          done

          if [ -z "$PROD_PORT" ]; then
            PROD_PORT=5000
          fi

          echo "📌 Production Port: $PROD_PORT"
          echo "PROD_PORT=$PROD_PORT" >> $GITHUB_ENV

          # Step 3: Remove old production container (force)
          exec_guest_cmd "🛑 Stop & remove old container" "sh -c 'docker rm -f draw 2>/dev/null || true'"

          # Step 4: Run production container on dynamic port
          exec_guest_cmd "🐳 Run production container" "sh -c 'docker run -d --name draw -p $PROD_PORT:${{ env.CONTAINER_PORT }} $REGISTRY_IMAGE'"

          # Step 5: Verify
          exec_guest_cmd "✅ Verify container" "sh -c 'docker ps -a --filter name=draw'"

          echo ""
          echo "✅ Production deployed on port $PROD_PORT"

      - name: 🌐 Setup Cloudflare DNS for Production
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TUNNEL_CNAME: 999c4880-cf1a-4dc5-bd51-04a96563aae9.cfargotunnel.com
          PVE_TOKEN: PVEAPIToken=${{ secrets.PROXMOX_USER }}@pve!${{ secrets.PROXMOX_TOKEN_NAME }}=${{ secrets.PROXMOX_TOKEN_SECRET }}
          PVE_URL: https://${{ secrets.PROXMOX_HOST }}:${{ secrets.PROXMOX_PORT }}
          DOMAIN: oguzsak.com
          HOSTNAME: draw
          NODE: prox
          VMID: ${{ env.GUEST_VMID }}
        run: |
          set -e
          FULL_HOSTNAME="${HOSTNAME}.${DOMAIN}"

          echo "🔗 Configuring Cloudflare DNS for production: $FULL_HOSTNAME"

          # Get homelab VM IP from Proxmox
          echo "📍 Fetching homelab VM IP from Proxmox..."
          VM_CONFIG=$(curl -s -k -X GET \
            "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/status/current" \
            -H "Authorization: $PVE_TOKEN")

          HOMELAB_IP=$(echo "$VM_CONFIG" | jq -r '.data.ha // empty')
          if [ -z "$HOMELAB_IP" ]; then
            # Try alternative method: get from guest agent
            HOMELAB_IP=$(curl -s -k -X GET \
              "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/agent/get-osinfo" \
              -H "Authorization: $PVE_TOKEN" 2>/dev/null | jq -r '.data.ip-addresses[0].ip-address // empty')
          fi

          if [ -z "$HOMELAB_IP" ]; then
            echo "⚠️ Could not get IP from Proxmox, using fallback"
            HOMELAB_IP="10.10.10.107"
          fi

          echo "✅ Homelab IP: $HOMELAB_IP"

          # Check if DNS record exists
          EXISTING_RECORD_ID=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=${FULL_HOSTNAME}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" | jq -r '.result[0].id // empty')

          if [ -z "$EXISTING_RECORD_ID" ]; then
            echo "Creating DNS CNAME record for $FULL_HOSTNAME -> $TUNNEL_CNAME"
            curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"type\": \"CNAME\",
                \"name\": \"${HOSTNAME}\",
                \"content\": \"${TUNNEL_CNAME}\",
                \"proxied\": true,
                \"comment\": \"Production deployment via Cloudflare Tunnel\"
              }" | jq '.'
          else
            echo "✅ DNS CNAME record already exists (ID: $EXISTING_RECORD_ID)"
          fi

          # Add ingress rule to Cloudflare Tunnel configuration
          echo "🔌 Adding Cloudflare Tunnel ingress rule for $FULL_HOSTNAME -> http://$HOMELAB_IP:${{ env.PROD_PORT }}"

          # Get current tunnel config
          TUNNEL_CONFIG=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$(echo $CF_TOKEN | cut -d'_' -f2 | cut -d'-' -f1)/cfd_tunnel/${TUNNEL_ID}/public_hostname" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" 2>/dev/null || echo '{"success":true,"result":[]}')

          # Check if ingress rule already exists for this hostname
          RULE_EXISTS=$(echo "$TUNNEL_CONFIG" | jq "any(.result[]; .hostname == \"${FULL_HOSTNAME}\")" 2>/dev/null || echo "false")

          if [ "$RULE_EXISTS" != "true" ]; then
            echo "Creating new ingress rule"
            curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$(curl -s -X GET 'https://api.cloudflare.com/client/v4/accounts' -H "Authorization: Bearer ${CF_TOKEN}" | jq -r '.result[0].id')/cfd_tunnel/${TUNNEL_ID}/public_hostname" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"hostname\": \"${FULL_HOSTNAME}\",
                \"service\": \"http://${HOMELAB_IP}:${{ env.PROD_PORT }}\"
              }" | jq '.'
          else
            echo "✅ Ingress rule already exists for $FULL_HOSTNAME"
          fi

          echo "✅ Production Cloudflare configuration complete!"

      - name: 💬 Comment Production URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ env.PR_NUMBER }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🌍 **Production Live!**\n\n🎉 Your changes are now live at https://draw.oguzsak.com`
            })

  # ========== CLEANUP STAGE ==========
  cleanup:
    name: 🧹 Cleanup Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.number }}

    steps:
      - name: 🗑️ Stop Container
        env:
          PVE_TOKEN: PVEAPIToken=${{ secrets.PROXMOX_USER }}@pve!${{ secrets.PROXMOX_TOKEN_NAME }}=${{ secrets.PROXMOX_TOKEN_SECRET }}
          PVE_URL: https://${{ secrets.PROXMOX_HOST }}:${{ secrets.PROXMOX_PORT }}
          NODE: prox
          VMID: ${{ env.GUEST_VMID }}
        run: |
          set -e

          # Helper function to execute command via guest agent
          exec_guest_cmd() {
            local desc=$1
            local cmd=$2
            echo "⏳ $desc..."

            # 1. Start command and get PID
            # Extract actual command from "sh -c 'command'" pattern
            if [[ $cmd =~ ^sh\ -c\ \'(.*)\'$ ]]; then
              local actual_cmd="${BASH_REMATCH[1]}"
              RESP=$(curl -s -k -X POST "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/agent/exec" \
                -H "Authorization: $PVE_TOKEN" \
                --data-urlencode "command=sh" \
                --data-urlencode "command=-c" \
                --data-urlencode "command=$actual_cmd" 2>/dev/null)
            else
              echo "❌ Command must be wrapped with sh -c 'command'"
              return 1
            fi

            PID=$(echo "$RESP" | jq -r '.data.pid // empty')
            if [ -z "$PID" ]; then
              echo "⚠️ Could not start cleanup"
              return 0
            fi

            # 2. Poll for completion (max 15s)
            for i in {1..15}; do
              sleep 1

              STATUS=$(curl -s -k -X GET "$PVE_URL/api2/json/nodes/$NODE/qemu/$VMID/agent/exec-status?pid=$PID" \
                -H "Authorization: $PVE_TOKEN" 2>/dev/null)

              EXITED=$(echo "$STATUS" | jq -r '.data.exited // 0')

              if [ "$EXITED" -eq 1 ]; then
                echo "✅ Cleaned up"
                return 0
              fi
            done

            echo "⚠️ Cleanup timeout"
            return 0
          }

          # Remove PR container (find and remove all containers matching pattern)
          exec_guest_cmd "Remove container" "sh -c 'docker ps -aq --filter \"name=^pr-${{ env.PR_NUMBER }}-draw\" | xargs -r docker rm -f'"

      - name: 🌐 Remove DNS Record
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_DOMAIN: ${{ secrets.CLOUDFLARE_DOMAIN }}
        run: |
          set -e
          RECORD=$(curl -s -X GET -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=pr-${{ env.PR_NUMBER }}-draw.$CF_DOMAIN")

          RECORD_ID=$(echo $RECORD | jq -r '.result[0].id // empty')
          [ ! -z "$RECORD_ID" ] && curl -s -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$RECORD_ID" || true

          echo "✅ DNS cleaned up"

      - name: 💬 Cleanup Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ env.PR_NUMBER }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🧹 **Preview Cleaned**\n\nDocker container and DNS record removed.`
            })

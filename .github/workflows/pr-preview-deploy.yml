name: 🚀 PR Preview Deploy (Docker + Cloudflare Tunnel)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  IMAGE_NAME: goal-hedef-preview
  PR_NUMBER: ${{ github.event.number }}
  CONTAINER_PORT: 80

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # 1️⃣ Build Docker Image
      - name: 🐳 Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:pr-${{ env.PR_NUMBER }} \
            -f apps/goal-hedef/Dockerfile \
            .

      # 2️⃣ Save and transfer to homelab
      - name: 💾 Save Docker image
        run: |
          docker save ${{ env.IMAGE_NAME }}:pr-${{ env.PR_NUMBER }} | gzip > image-pr-${{ env.PR_NUMBER }}.tar.gz

      # 3️⃣ Deploy to Homelab
      - name: 🚀 Deploy to Homelab Docker
        env:
          HOMELAB_SSH_KEY: ${{ secrets.HOMELAB_SSH_KEY }}
          HOMELAB_HOST: ${{ secrets.HOMELAB_HOST }}
          HOMELAB_USER: ${{ secrets.HOMELAB_USER }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$HOMELAB_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOMELAB_HOST >> ~/.ssh/known_hosts

          # Transfer image
          scp -i ~/.ssh/id_rsa image-pr-${{ env.PR_NUMBER }}.tar.gz $HOMELAB_USER@$HOMELAB_HOST:/tmp/

          # Load and run container on homelab
          ssh -i ~/.ssh/id_rsa $HOMELAB_USER@$HOMELAB_HOST bash << 'EOFBASH'
          # Load image
          docker load -i /tmp/image-pr-${{ env.PR_NUMBER }}.tar.gz

          # Stop old container if exists
          docker stop pr-${{ env.PR_NUMBER }}-draw 2>/dev/null || true
          docker rm pr-${{ env.PR_NUMBER }}-draw 2>/dev/null || true

          # Run new container
          docker run -d \
            --name pr-${{ env.PR_NUMBER }}-draw \
            -p 3000:${{ env.CONTAINER_PORT }} \
            ${{ env.IMAGE_NAME }}:pr-${{ env.PR_NUMBER }}

          # Clean up
          rm /tmp/image-pr-${{ env.PR_NUMBER }}.tar.gz
          EOFBASH

      # 4️⃣ Configure Cloudflare Tunnel Route
      - name: 🌐 Setup Cloudflare Tunnel Route
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_DOMAIN: ${{ secrets.CLOUDFLARE_DOMAIN }}
          HOMELAB_HOST: ${{ secrets.HOMELAB_HOST }}
        run: |
          SUBDOMAIN="pr-${{ env.PR_NUMBER }}-draw"

          # Create DNS record for Cloudflare Tunnel routing
          curl -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records \
            -d "{
              \"type\": \"CNAME\",
              \"name\": \"$SUBDOMAIN\",
              \"content\": \"$HOMELAB_HOST\",
              \"ttl\": 1,
              \"proxied\": true
            }"

          echo "✅ DNS record created: $SUBDOMAIN.$CF_DOMAIN"

      # 5️⃣ Post Preview Comment
      - name: 💬 Comment Preview URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `https://pr-${prNumber}-draw.${{ secrets.CLOUDFLARE_DOMAIN }}`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Preview Ready!**\n\n🌐 **URL:** [${previewUrl}](${previewUrl})\n\n📦 Running in Docker on homelab\n🔗 Accessible via Cloudflare Tunnel\n🧹 Cleanup on PR close\n\n**Test it:**\n1. Visit the preview URL\n2. Test your changes\n3. Share feedback`
            })

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: 🗑️ Stop Docker container
        env:
          HOMELAB_SSH_KEY: ${{ secrets.HOMELAB_SSH_KEY }}
          HOMELAB_HOST: ${{ secrets.HOMELAB_HOST }}
          HOMELAB_USER: ${{ secrets.HOMELAB_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$HOMELAB_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOMELAB_HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_rsa $HOMELAB_USER@$HOMELAB_HOST bash << 'EOFBASH'
          docker stop pr-${{ env.PR_NUMBER }}-draw 2>/dev/null || true
          docker rm pr-${{ env.PR_NUMBER }}-draw 2>/dev/null || true
          docker rmi goal-hedef-preview:pr-${{ env.PR_NUMBER }} 2>/dev/null || true
          EOFBASH

      - name: 🌐 Remove DNS Record
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          # Get and delete DNS record
          RECORD=$(curl -s -X GET \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=pr-${{ env.PR_NUMBER }}-draw")

          RECORD_ID=$(echo $RECORD | jq -r '.result[0].id // empty')

          if [ ! -z "$RECORD_ID" ]; then
            curl -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$RECORD_ID"
          fi

      - name: ✅ Cleanup comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🧹 **Preview Cleaned**\n\nDocker container and DNS record removed.`
            })

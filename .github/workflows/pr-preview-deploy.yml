name: 🚀 PR Preview Deploy (Proxmox QEMU Guest Agent + Cloudflare)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: goal-hedef-preview
  IMAGE_TAG: pr-${{ github.event.number }}
  PR_NUMBER: ${{ github.event.number }}
  CONTAINER_PORT: 80
  GUEST_VMID: "100"

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # 1️⃣ Build Docker Image
      - name: 🐳 Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -f apps/goal-hedef/Dockerfile \
            .

      # 2️⃣ Login to GitHub Container Registry
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3️⃣ Push Docker Image
      - name: 📤 Push Docker image to registry
        run: |
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          echo "✅ Image pushed to registry"
          echo "   URL: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      # 4️⃣ Deploy via Proxmox QEMU Guest Agent
      - name: 🚀 Deploy to Homelab (Proxmox QEMU Guest Agent)
        env:
          PROXMOX_HOST: ${{ secrets.PROXMOX_HOST }}
          PROXMOX_PORT: ${{ secrets.PROXMOX_PORT }}
          PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
          PROXMOX_TOKEN_NAME: ${{ secrets.PROXMOX_TOKEN_NAME }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Setup Proxmox API
          PROXMOX_API="https://${PROXMOX_HOST}:${PROXMOX_PORT}/api2/json"
          API_TOKEN="PVEAPIToken=${PROXMOX_USER}!${PROXMOX_TOKEN_NAME}=${PROXMOX_TOKEN_SECRET}"

          # Get the node name where QEMU guest is running
          NODE=$(curl -s -k \
            -H "Authorization: $API_TOKEN" \
            "${PROXMOX_API}/cluster/resources?type=vm" \
            | jq -r ".data[] | select(.vmid | tonumber == ${{ env.GUEST_VMID }}) | .node" | head -1)

          echo "📍 Guest running on node: $NODE"

          # Base64 encode commands for QEMU Guest Agent
          # Commands: login to registry, pull image, stop/remove old container, run new container
          COMMANDS_B64=$(echo -n "echo '${{ secrets.GITHUB_TOKEN }}' | docker login -u ${{ github.actor }} --password-stdin ${{ env.REGISTRY }} && \
            docker pull ${{ env.REGISTRY_IMAGE }} && \
            docker stop pr-${{ env.PR_NUMBER }}-draw 2>/dev/null || true && \
            docker rm pr-${{ env.PR_NUMBER }}-draw 2>/dev/null || true && \
            docker run -d \
              --name pr-${{ env.PR_NUMBER }}-draw \
              -p 3000:${{ env.CONTAINER_PORT }} \
              ${{ env.REGISTRY_IMAGE }}" | base64 -w 0)

          echo "🐳 Executing deployment commands via QEMU Guest Agent..."

          # Execute via Proxmox Guest Agent using 'execute-raw'
          curl -s -k -X POST \
            -H "Authorization: $API_TOKEN" \
            -H "Content-Type: application/json" \
            "${PROXMOX_API}/nodes/${NODE}/qemu/${{ env.GUEST_VMID }}/agent/exec" \
            -d "{\"command\": \"sh -c 'echo $COMMANDS_B64 | base64 -d | bash'\"}" \
            | jq '.' || echo "Guest Agent command submitted"

          echo "✅ Container deployment initiated"
          echo "   Container: pr-${{ env.PR_NUMBER }}-draw"
          echo "   Image: ${{ env.REGISTRY_IMAGE }}"
          echo "   Port: 3000:${{ env.CONTAINER_PORT }}"

      # 5️⃣ Configure Cloudflare Tunnel Route
      - name: 🌐 Setup Cloudflare Tunnel Route
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_DOMAIN: ${{ secrets.CLOUDFLARE_DOMAIN }}
          HOMELAB_HOST: ${{ secrets.HOMELAB_HOST }}
        run: |
          SUBDOMAIN="pr-${{ env.PR_NUMBER }}-draw"

          # Create DNS record for Cloudflare Tunnel routing
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records \
            -d "{
              \"type\": \"CNAME\",
              \"name\": \"$SUBDOMAIN\",
              \"content\": \"$HOMELAB_HOST\",
              \"ttl\": 1,
              \"proxied\": true
            }")

          echo "$RESPONSE" | jq '.'
          echo "✅ DNS record created: $SUBDOMAIN.$CF_DOMAIN"

      # 6️⃣ Post Preview Comment
      - name: 💬 Comment Preview URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = `https://pr-${{ env.PR_NUMBER }}-draw.${{ secrets.CLOUDFLARE_DOMAIN }}`;
            const registryImage = `${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}`;

            github.rest.issues.createComment({
              issue_number: ${{ env.PR_NUMBER }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Preview Ready!**\n\n🌐 **URL:** [${previewUrl}](${previewUrl})\n\n📦 **Deployment Details:**\n- Container: pr-${{ env.PR_NUMBER }}-draw\n- Image: ${registryImage}\n- Port: 3000:80\n- Host: Proxmox QEMU Guest (via Guest Agent)\n- Route: Cloudflare Tunnel CNAME\n\n**Test it:**\n1. Visit the preview URL\n2. Test your changes\n3. Share feedback\n\n🧹 Preview cleanup on PR close`
            })

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: 🗑️ Stop Docker container (Proxmox Guest Agent)
        env:
          PROXMOX_HOST: ${{ secrets.PROXMOX_HOST }}
          PROXMOX_PORT: ${{ secrets.PROXMOX_PORT }}
          PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
          PROXMOX_TOKEN_NAME: ${{ secrets.PROXMOX_TOKEN_NAME }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
        run: |
          PROXMOX_API="https://${PROXMOX_HOST}:${PROXMOX_PORT}/api2/json"
          API_TOKEN="PVEAPIToken=${PROXMOX_USER}!${PROXMOX_TOKEN_NAME}=${PROXMOX_TOKEN_SECRET}"

          # Get node name
          NODE=$(curl -s -k \
            -H "Authorization: $API_TOKEN" \
            "${PROXMOX_API}/cluster/resources?type=vm" \
            | jq -r ".data[] | select(.vmid | tonumber == ${{ env.GUEST_VMID }}) | .node" | head -1)

          echo "🗑️  Stopping container on node: $NODE"

          # Stop and remove container
          CLEANUP_CMD="docker stop pr-${{ env.PR_NUMBER }}-draw 2>/dev/null || true && docker rm pr-${{ env.PR_NUMBER }}-draw 2>/dev/null || true"
          CLEANUP_B64=$(echo -n "$CLEANUP_CMD" | base64 -w 0)

          curl -s -k -X POST \
            -H "Authorization: $API_TOKEN" \
            -H "Content-Type: application/json" \
            "${PROXMOX_API}/nodes/${NODE}/qemu/${{ env.GUEST_VMID }}/agent/exec" \
            -d "{\"command\": \"sh -c 'echo $CLEANUP_B64 | base64 -d | bash'\"}" \
            | jq '.' || echo "Cleanup command submitted"

          echo "✅ Container stopped and removed"

      - name: 🌐 Remove DNS Record
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_DOMAIN: ${{ secrets.CLOUDFLARE_DOMAIN }}
        run: |
          # Get and delete DNS record
          RECORD=$(curl -s -X GET \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=pr-${{ env.PR_NUMBER }}-draw.$CF_DOMAIN")

          RECORD_ID=$(echo $RECORD | jq -r '.result[0].id // empty')

          if [ ! -z "$RECORD_ID" ]; then
            curl -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$RECORD_ID"
            echo "✅ DNS record deleted: pr-${{ env.PR_NUMBER }}-draw.$CF_DOMAIN"
          else
            echo "⚠️  DNS record not found (already deleted?)"
          fi

      - name: ✅ Cleanup comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ env.PR_NUMBER }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🧹 **Preview Cleaned**\n\nDocker container stopped and removed.\nCloudflare DNS record deleted.`
            })

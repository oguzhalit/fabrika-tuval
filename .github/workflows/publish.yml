name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @kampus packages to npm
    runs-on: ubuntu-latest
    steps:
      - name: Verify this is a tag
        if: github.ref_type != 'tag'
        run: exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --recursive --filter "@kampus/*"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
